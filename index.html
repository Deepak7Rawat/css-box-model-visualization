<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .cantainer{
            height: 500px;
            width: 70%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto;
            background-color: teal;
        }
        .box{
            height: 80%;
            width: 80%;
            background-color: skyblue;
        }
        .box1{
            border: 20px solid navy;
            margin: 40px 60px 40px 75px;
            padding: 70px 20px 40px 105px;
            height: 80%;
            width: 80%;
            background-color: blue;
        }
        .box2{
            text-align: center;
            line-height: 120px;
            height: 80%;
            width: 80%;
            background-color: orange;
            
        }
        .margin{
            position: absolute;
            left: 48%;
            top: 15%;
        }
        .border{
            position: absolute;
            left: 48%;
            top: 20%;
            color: white;
        }
        .padding{
            position: absolute;
            left: 48%;
            top: 27%;
            color: white;
        }
        .content{
            position: absolute;
            left: 48%;
            top: 34%;
            color: white;
        }

    </style>
</head>
<body>
    <h1 align="center">Box-Modeling</h1>
    <div class="cantainer">
        <div class="box">
            <P class="margin">Margin</P>
            <div class="box1">
                <P class="border">Border</P>
                <P class="padding">Padding</P>
                <div class="box2">
                    <P class="content">Content</P>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
